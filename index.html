<!DOCTYPE html>
<!--
  Финансовый шарик МТС Деньги — готовый прототип.

  Для коллег: отдайте файл financial-ball.html (сборка: python3 build.py single).
  Его можно открыть двойным кликом, положить на любой HTTPS-хост или в WebView.
  Ничего настраивать не нужно.

  UTM-ссылка (пример):
    https://ваш-домен/ball.html?utm_source=sms&utm_medium=push&utm_campaign=magic_ball
  События уходят в window.dataLayer (GTM) и копится в localStorage / window.__ballStats:
    ball_view, ball_ask (trigger: form|chip|tap|shake), ball_answer.
  Смотреть счётчики в консоли: __ballStats.summary()
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Финансовый шарик — МТС Деньги</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<style>
  @font-face { font-family: 'MTS Compact'; font-weight: 400; font-display: swap;
    src: url('assets/fonts/MTSCompact-400.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Compact'; font-weight: 500; font-display: swap;
    src: url('assets/fonts/MTSCompact-500.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Compact'; font-weight: 700; font-display: swap;
    src: url('assets/fonts/MTSCompact-700.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Wide'; font-weight: 700; font-display: swap;
    src: url('assets/fonts/MTSWide-700.woff2') format('woff2'); }
  /* Иерархия гайда (стр. 17–20): Wide Medium — заголовки, Text Regular — текст,
     Compact Regular — лигалы и служебное. */
  @font-face { font-family: 'MTS Wide'; font-weight: 500; font-display: swap;
    src: url('assets/fonts/MTSWide-500.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Text'; font-weight: 400; font-display: swap;
    src: url('assets/fonts/MTSText-400.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Text'; font-weight: 500; font-display: swap;
    src: url('assets/fonts/MTSText-500.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Text'; font-weight: 700; font-display: swap;
    src: url('assets/fonts/MTSText-700.woff2') format('woff2'); }

  :root {
    /* Палитра «МТС Деньги»: основная (стр. 21) + 3D-стиль (стр. 32).
       Красный — точечный акцент, а не заливка. */
    --mts-red: #FF0032;
    --mts-lime: #D9F38B;
    --mts-white: #FAFAFC;
    --scene-light: #E4EFFF;
    --scene-dark: #303B57;
    --ink: #303B57;
    --ink-dim: rgba(48,59,87,.62);
    /* «Плашка glass»: color 16 %, corner radius 26 (стр. 22) */
    --pill: rgba(250,250,252,.58);
    --pill-line: rgba(48,59,87,.13);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'MTS Text', system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    /* фон во всю ширину окна — на десктопе не остаётся чёрных полей по бокам */
    /* «Моноцвет» из гайда (стр. 45): светлая база #E4EFFF, к низу уходит
       в лавандово-серый — верх кадра остаётся чистым */
    background:
      radial-gradient(120% 55% at 50% -6%, #FFFFFF 0%, rgba(255,255,255,0) 62%),
      radial-gradient(130% 70% at 50% 108%, #C3D3EE 0%, rgba(195,211,238,0) 64%),
      linear-gradient(180deg, #E4EFFF 0%, #DDE8F9 54%, #CEDBF0 100%);
  }
  /* Экран прибит к вьюпорту: страница не скроллится ни при какой высоте адресной строки.
     Три высоты подряд — фолбэк для браузеров без svh/dvh. */
  #stage {
    position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
    height: 100vh; height: 100svh; height: 100dvh;
    height: var(--app-h, 100vh);   /* JS ставит реальную высоту: во встроенных
                                      WebView мессенджеров vh/svh/dvh врут */
    max-width: 520px; display: flex; flex-direction: column;
  }
  /* звёздная пыль */
  .dust { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .dust i {
    position: absolute; display: block; width: 3px; height: 3px; border-radius: 50%;
    background: var(--scene-dark); opacity: 0;
    animation: tw 4.2s ease-in-out infinite;
  }
  @keyframes tw {
    0%, 100% { opacity: 0; transform: translateY(0) scale(.6); }
    45% { opacity: .26; transform: translateY(-7px) scale(1); }
  }

  header {
    --header-pad-top: calc(16px + env(safe-area-inset-top));
    --headline-shift: clamp(16px, 5vh, 46px);
    position: relative; z-index: 5; flex: 0 0 auto;
    padding: var(--header-pad-top) 18px 0;
  }
  /* Лок-ап саббренда слева, материнский знак МТС справа (стр. 10–11).
     Пропорция из макета гайда: знак ДЕНЬГИ 76 px против квадрата МТС 143 px,
     то есть сторона ×2 — «1/4 от логотипа МТС» считается по площади.
     Верхние края выровнены, как в оригинале. */
  .brandbar {
    display: flex; align-items: flex-start; justify-content: flex-end;
    margin-bottom: clamp(8px, 1.6vh, 14px);
  }
  /* Таблица стр. 11 для формата ~2:3 даёт 18.4 % ширины (≈79 px на карточке 430).
     Взят компромисс ≈14 %: ближе к норме, но знак не спорит с заголовком.
     Считаем от ширины сцены, а не от вьюпорта, — иначе на мобильном выходило вдвое мельче. */
  .brandbar__mts { height: clamp(46px, 14vw, 60px); width: auto; display: block; }
  @media (max-height: 640px) {
    .brandbar { margin-bottom: 6px; }
    .brandbar__mts { height: 40px; }
  }

  /* Высота шапки только от .punch — ответ абсолютный, иначе шар дёргается. */
  .headline { display: grid; margin-top: var(--headline-shift, 0px); }
  .headline > * { grid-area: 1 / 1; transition: opacity .35s, transform .35s; }
  .punch {
    font: 500 clamp(19px, 5.6vw, 27px)/1.18 'MTS Wide';
    letter-spacing: .01em;
  }
  .punch em { font-style: normal; color: var(--mts-red); }
  .answer {
    position: absolute; left: 0; right: 0; z-index: 6;
    top: calc(var(--header-pad-top) + 52px + var(--headline-shift, 0px));
    padding: 0 18px; text-align: center; pointer-events: none;
    font: 500 clamp(21px, 6.4vw, 30px)/1.14 'MTS Wide';
    color: var(--scene-dark); text-shadow: 0 4px 28px rgba(228,239,255,.9);
    opacity: 0; transform: translateY(8px);
  }
  /* состояния помечаем префиксом is-, чтобы класс на <body> не совпал с классом элемента */
  #statusText {
    font: 400 13px/1.35 'MTS Text'; color: var(--ink-dim);
    letter-spacing: .04em; opacity: 0; transform: translateY(6px); align-self: center;
  }
  body.is-answered .punch { opacity: 0; transform: translateY(-8px); }
  body.is-answered .answer { opacity: 1; transform: none; }
  body.is-thinking .punch { opacity: 0; transform: translateY(-6px); }
  body.is-thinking #statusText { opacity: 1; transform: none; }

  /* Вопрос под сферой (absolute в ballWrap). */
  #questionLine {
    position: absolute; left: 18px; right: 18px; bottom: 12%;
    z-index: 5; pointer-events: none; text-align: center;
    font: 500 clamp(14px, 3.8vw, 17px)/1.35 'MTS Text';
    color: var(--ink); letter-spacing: .01em;
    opacity: 0; transform: translateY(8px);
    transition: opacity .4s, transform .4s;
    text-wrap: balance;
    text-shadow: 0 2px 16px rgba(228,239,255,.85);
  }
  body.has-question #questionLine {
    opacity: 1; transform: none;
  }
  body.has-question #hint { opacity: 0; }

  #ballWrap { position: relative; flex: 1 1 auto; min-height: 0; z-index: 2; }
  #ballWrap canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  #boot {
    position: absolute; inset: 0; z-index: 6;
    display: grid; place-content: center; justify-items: center; gap: 14px;
    text-align: center; padding: 0 28px; transition: opacity .4s;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(48,59,87,.16); border-top-color: var(--mts-red);
    animation: spin 0.9s linear infinite;
  }
  #boot.failed .ring { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot .msg { font: 400 13px/1.45 'MTS Compact'; color: var(--ink-dim); max-width: 300px; }


  footer {
    position: relative; z-index: 5; flex: 0 0 auto;
    padding-left: 16px; padding-right: 16px; padding-top: 0;
    /* при открытой клавиатуре JS дописывает сюда её высоту через <style id="kbStyle"> */
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: clamp(8px, 2vh, 14px);
  }
  /* пока человек печатает, лишнее убираем — поле и подсказки должны быть на виду */
  body.kb-open #hint { display: none; }
  /* на низких экранах ужимаем текст, лишь бы всё влезло без скролла */
  @media (max-height: 640px) {
    .punch { font-size: clamp(15px, 4.4vw, 19px); }
    .answer { font-size: clamp(17px, 5vw, 22px); }
    .chip { padding: 7px 12px; font-size: 12.5px; }
    #hint { display: none; }
    #questionLine { font-size: clamp(13px, 3.4vw, 15px); bottom: 10%; }
    header { --header-pad-top: calc(10px + env(safe-area-inset-top)); --headline-shift: 8px; }
  }
  /* на десктопе — законченная карточка приложения по центру, а не узкая полоса */
  @media (min-width: 680px) and (min-height: 660px) {
    body { display: grid; place-items: center; }
    #stage {
      position: relative; top: auto; left: auto; right: auto;
      height: min(860px, 92vh); max-width: 430px;
      border-radius: 30px; overflow: hidden;
      box-shadow: 0 40px 120px rgba(48,59,87,.28), 0 0 0 1px rgba(48,59,87,.08);
      background: linear-gradient(180deg, #E4EFFF 0%, #DDE8F9 54%, #CEDBF0 100%);
    }
    header { --header-pad-top: 22px; }
  }
  .punch em { font-style: normal; color: var(--mts-red); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--pill-line); background: var(--pill);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--ink); border-radius: 100px; padding: 9px 14px;
    font: 500 13.5px/1 'MTS Text'; cursor: pointer;
  }
  .ask {
    display: flex; align-items: center; gap: 8px;
    background: #ffffff; border-radius: 20px; padding: 7px 7px 7px 18px;
    overflow: hidden;
    /* одна мягкая тень — полупрозрачный фон+blur на старых GPU давали зелёную кромку */
    box-shadow: 0 10px 28px rgba(48,59,87,.16);
  }
  .ask input {
    flex: 1; border: 0; outline: 0;
    background: #ffffff; color: var(--ink); caret-color: var(--ink);
    -webkit-appearance: none; appearance: none;
    font: 500 15.5px/1.2 'MTS Text'; min-width: 0;
  }
  .ask input::placeholder { color: rgba(48,59,87,.44); }
  .ask input:-webkit-autofill,
  .ask input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 40px #fff inset;
    -webkit-text-fill-color: #303B57;
    caret-color: #303B57;
  }
  /* Кнопка в языке МТС: скруглённый квадрат («сквиркл»), фирменный красный, белая иконка */
  .ask button {
    width: 46px; height: 46px; border-radius: 14px; border: 0; cursor: pointer;
    background: linear-gradient(180deg, #FF3D62 0%, var(--mts-red) 58%, #D60029 100%);
    color: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 16px rgba(255,0,50,.34), inset 0 1px 0 rgba(255,255,255,.28);
    transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  .ask button svg { width: 20px; height: 20px; display: block; }
  .ask button:hover { box-shadow: 0 8px 22px rgba(255,0,50,.46), inset 0 1px 0 rgba(255,255,255,.3); }
  .ask button:active { transform: scale(.94); }
  .ask button:disabled { opacity: .45; box-shadow: none; }

  #hint {
    /* Проценты считаются от #stage, а не от #ballWrap. После сдвига заголовка
       низ шара опустился, поэтому подсказку ставим в полосу между ним и чипами. */
    position: absolute; left: 0; right: 0; bottom: 21%;
    text-align: center; pointer-events: none; z-index: 4;
    font: 400 12.5px/1.3 'MTS Compact'; color: rgba(48,59,87,.52);
    opacity: 1; transition: opacity .5s;
  }
  #hint.hide { opacity: 0; }
</style>
<style id="kbStyle"></style>
</head>
<body>
<div id="stage">
  <div class="dust" id="dust"></div>
  <header>
    <div class="brandbar">
      <img class="brandbar__mts" src="assets/brand/logo-mts.png" alt="МТС" />
    </div>
    <div class="headline">
      <div class="punch">Спроси про деньги — <em>шар уже знает</em></div>
      <div class="answer" id="answerLine" aria-live="polite"></div>
      <div class="thinking" id="statusText"></div>
    </div>
  </header>

  <div id="ballWrap">
    <div id="boot">
      <div class="ring"></div>
      <div class="msg" id="bootMsg">загружаем шар…</div>
    </div>
    <div id="questionLine" aria-live="polite"></div>
  </div>
  <div id="hint">нажми на шар, задай вопрос или встряхни телефон</div>

  <footer>
    <div class="chips" id="chips">
      <button class="chip">Стоит ли инвестировать?</button>
      <button class="chip">Брать ли кредит?</button>
      <button class="chip">Ждать ли премию?</button>
      <button class="chip">Пора ли копить?</button>
    </div>
    <form class="ask" id="askForm">
      <input id="q" type="text" placeholder="Твой вопрос шару…" autocomplete="off"
             inputmode="text" autocorrect="off" autocapitalize="off"
             spellcheck="false" maxlength="120">
      <button type="submit" id="sendBtn" aria-label="Спросить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
        </svg>
      </button>
    </form>
  </footer>
</div>

<script>
/* Обычный скрипт, без модулей: выполнится даже там, где ES-модули или importmap
   не поддерживаются. Его задача — не оставить пользователя перед пустым экраном. */
(function () {
  /* Высота экрана из JS: в in-app браузерах (Telegram и т.п.) 100vh больше видимой
     области, а svh/dvh не поддерживаются. Клавиатура — отдельный случай: под неё
     нельзя ужимать экран, иначе всё «схлопывается». Поднимаем только поле ввода. */
  var root = document.documentElement;
  function layout() {
    var vv = window.visualViewport;
    var winH = window.innerHeight || 0;
    var kb = vv ? Math.max(0, winH - vv.height - vv.offsetTop) : 0;
    var kbStyle = document.getElementById('kbStyle');
    if (kb < 120) {                       // клавиатуры нет — фиксируем высоту экрана
      var h = Math.round((vv && vv.height) || winH);
      if (h > 0) root.style.setProperty('--app-h', h + 'px');
      if (kbStyle) kbStyle.textContent = '';
      document.body.classList.remove('kb-open');
    } else {
      // Клавиатура открыта: высоту экрана НЕ трогаем (иначе всё схлопывается),
      // а отдаём ей место снизу — поле встаёт над клавиатурой, шар ужимается.
      // Правило пишем целиком: var() в calc здесь срабатывает не во всех движках.
      if (kbStyle) kbStyle.textContent =
        'footer{padding-bottom:' + (Math.round(kb) + 12) + 'px !important}';
      document.body.classList.add('kb-open');
    }
    if (window.pageYOffset) window.scrollTo(0, 0);   // iOS сам скроллит к полю — отменяем
  }
  layout();
  addEventListener('resize', layout);
  addEventListener('scroll', layout, { passive: true });
  addEventListener('orientationchange', function () { setTimeout(layout, 300); });
  addEventListener('pageshow', layout);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', layout);
    visualViewport.addEventListener('scroll', layout);
  }
  document.addEventListener('DOMContentLoaded', function () {
    layout();
    /* delegation: поле #q могут пересоздавать при очистке на iOS */
    var form = document.getElementById('askForm');
    if (form) {
      form.addEventListener('focusin', function () { setTimeout(layout, 120); });
      form.addEventListener('focusout', function () { setTimeout(layout, 120); });
    }
  });

  var shown = false;
  function fail(text) {
    if (shown) return;
    shown = true;
    var boot = document.getElementById('boot');
    var msg = document.getElementById('bootMsg');
    if (!boot || !msg) return;
    boot.classList.add('failed');
    boot.classList.remove('done');
    msg.textContent = text;
  }
  window.__bootFail = fail;
  window.addEventListener('error', function (e) {
    fail('Не удалось запустить 3D: ' + (e.message || 'ошибка загрузки') +
         '. Попробуйте обновить браузер.');
  });
  window.addEventListener('unhandledrejection', function () {
    fail('Не удалось загрузить модель шара. Проверьте соединение и обновите страницу.');
  });
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.__ball) {
        try {
          var c = document.createElement('canvas');
          var gl = c.getContext('webgl2') || c.getContext('webgl');
          fail(gl ? 'Шар долго не загружается — проверьте соединение и обновите страницу.'
                  : 'Ваш браузер не поддерживает WebGL, 3D-шар не запустится.');
        } catch (err) { fail('3D недоступно в этом браузере.'); }
      }
    }, 12000);
  });
})();
</script>
<script src="bundle.js?v=75cc1aaf0e"></script>
</body>
</html>
