<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Финансовый шарик — МТС Деньги</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<style>
  @font-face { font-family: 'MTS Compact'; font-weight: 400; font-display: swap;
    src: url('assets/fonts/MTSCompact-400.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Compact'; font-weight: 500; font-display: swap;
    src: url('assets/fonts/MTSCompact-500.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Compact'; font-weight: 700; font-display: swap;
    src: url('assets/fonts/MTSCompact-700.woff2') format('woff2'); }
  @font-face { font-family: 'MTS Wide'; font-weight: 700; font-display: swap;
    src: url('assets/fonts/MTSWide-700.woff2') format('woff2'); }

  :root {
    --mts-red: #E2060F;
    --ink: #FFFFFF;
    --ink-dim: rgba(255,255,255,.56);
    --pill: rgba(255,255,255,.10);
    --pill-line: rgba(255,255,255,.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'MTS Compact', system-ui, sans-serif;
    color: var(--ink);
    background: #120E2B;
    overflow: hidden;
  }
  /* Экран прибит к вьюпорту: страница не скроллится ни при какой высоте адресной строки.
     Три высоты подряд — фолбэк для браузеров без svh/dvh. */
  #stage {
    position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
    height: 100vh; height: 100svh; height: 100dvh;
    height: var(--app-h, 100vh);   /* JS ставит реальную высоту: во встроенных
                                      WebView мессенджеров vh/svh/dvh врут */
    max-width: 520px; display: flex; flex-direction: column;
    background:
      radial-gradient(120% 55% at 50% -6%, #4A3A8F 0%, rgba(74,58,143,0) 60%),
      radial-gradient(130% 70% at 50% 108%, #2C2064 0%, rgba(44,32,100,0) 62%),
      linear-gradient(180deg, #1A1440 0%, #151034 52%, #120E2B 100%);
  }
  /* звёздная пыль */
  .dust { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .dust i {
    position: absolute; display: block; width: 3px; height: 3px; border-radius: 50%;
    background: #CFC6FF; opacity: 0;
    animation: tw 4.2s ease-in-out infinite;
  }
  @keyframes tw {
    0%, 100% { opacity: 0; transform: translateY(0) scale(.6); }
    45% { opacity: .85; transform: translateY(-7px) scale(1); }
  }

  header {
    position: relative; z-index: 5;
    padding: calc(14px + env(safe-area-inset-top)) 20px 0;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .close {
    width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.10); color: var(--ink-dim); font-size: 15px;
  }

  #ballWrap { position: relative; flex: 1 1 auto; min-height: 0; z-index: 2; }
  #ballWrap canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  #boot {
    position: absolute; inset: 0; z-index: 6;
    display: grid; place-content: center; justify-items: center; gap: 14px;
    text-align: center; padding: 0 28px; transition: opacity .4s;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.16); border-top-color: #B7A9FF;
    animation: spin 0.9s linear infinite;
  }
  #boot.failed .ring { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot .msg { font: 400 13px/1.45 'MTS Compact'; color: var(--ink-dim); max-width: 300px; }

  /* статус над шаром */
  #status {
    position: absolute; left: 0; right: 0; top: 6%;
    text-align: center; pointer-events: none; z-index: 4;
    opacity: 0; transform: translateY(6px); transition: opacity .45s, transform .45s;
  }
  #status.show { opacity: 1; transform: none; }
  #status .cap { font: 400 13px/1.3 'MTS Compact'; color: var(--ink-dim); letter-spacing: .04em; }
  #status .cap.big {
    font: 700 clamp(20px, 5.6vw, 24px)/1.2 'MTS Wide'; color: #fff; letter-spacing: .01em;
    text-shadow: 0 4px 34px rgba(150,128,255,.55);
  }

  footer {
    position: relative; z-index: 5; flex: 0 0 auto;
    padding: 0 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: clamp(8px, 2vh, 14px);
  }
  .punch {
    font: 700 clamp(18px, 5.4vw, 26px)/1.16 'MTS Wide';
    letter-spacing: .01em; padding: 0 6px;
  }
  /* на низких экранах жертвуем крупным заголовком, лишь бы всё влезло без скролла */
  @media (max-height: 620px) {
    .punch { font-size: clamp(15px, 4.4vw, 19px); }
    .chip { padding: 7px 12px; font-size: 12.5px; }
    #hint { display: none; }
  }
  .punch em { font-style: normal; color: #B7A9FF; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--pill-line); background: var(--pill);
    color: var(--ink); border-radius: 100px; padding: 9px 14px;
    font: 500 13.5px/1 'MTS Compact'; cursor: pointer; backdrop-filter: blur(6px);
  }
  .ask {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.985); border-radius: 20px; padding: 7px 7px 7px 18px;
    box-shadow: 0 14px 40px rgba(6,4,26,.45);
  }
  .ask input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font: 500 15.5px/1.2 'MTS Compact'; color: #1A1A24; min-width: 0;
  }
  .ask input::placeholder { color: #9A97AC; }
  /* Кнопка в языке МТС: скруглённый квадрат («сквиркл»), фирменный красный, белая иконка */
  .ask button {
    width: 46px; height: 46px; border-radius: 14px; border: 0; cursor: pointer;
    background: linear-gradient(180deg, #FF2A33 0%, var(--mts-red) 58%, #C40510 100%);
    color: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 16px rgba(226,6,15,.42), inset 0 1px 0 rgba(255,255,255,.28);
    transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  .ask button svg { width: 20px; height: 20px; display: block; }
  .ask button:hover { box-shadow: 0 8px 22px rgba(226,6,15,.55), inset 0 1px 0 rgba(255,255,255,.3); }
  .ask button:active { transform: scale(.94); }
  .ask button:disabled { opacity: .45; box-shadow: none; }

  #hint {
    position: absolute; left: 0; right: 0; bottom: 27%;
    text-align: center; pointer-events: none; z-index: 4;
    font: 400 12.5px/1.3 'MTS Compact'; color: rgba(255,255,255,.38);
    opacity: 1; transition: opacity .5s;
  }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="dust" id="dust"></div>
  <header>
    <button class="close" aria-label="Закрыть">✕</button>
  </header>

  <div id="ballWrap">
    <div id="status"><div class="cap" id="statusText">шар думает…</div></div>
    <div id="boot">
      <div class="ring"></div>
      <div class="msg" id="bootMsg">загружаем шар…</div>
    </div>
  </div>
  <div id="hint">нажми на шар или задай вопрос</div>

  <footer>
    <div class="punch">Спроси про деньги — <em>шар уже знает</em></div>
    <div class="chips" id="chips">
      <button class="chip">Стоит ли инвестировать?</button>
      <button class="chip">Брать ли кредит?</button>
      <button class="chip">Ждать ли премию?</button>
      <button class="chip">Пора ли копить?</button>
    </div>
    <form class="ask" id="askForm">
      <input id="q" type="text" placeholder="Твой вопрос шару…" autocomplete="off" maxlength="120">
      <button type="submit" id="sendBtn" aria-label="Спросить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
        </svg>
      </button>
    </form>
  </footer>
</div>

<script>
/* Обычный скрипт, без модулей: выполнится даже там, где ES-модули или importmap
   не поддерживаются. Его задача — не оставить пользователя перед пустым экраном. */
(function () {
  /* Высота экрана из JS. В in-app браузерах (Telegram, WhatsApp и т.п.) 100vh
     больше видимой области, а svh/dvh не поддерживаются — вёрстка уезжает вниз. */
  function applyHeight() {
    var vv = window.visualViewport;
    var h = Math.round((vv && vv.height) || window.innerHeight || 0);
    if (h > 0) document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  applyHeight();
  addEventListener('resize', applyHeight);
  addEventListener('orientationchange', function () { setTimeout(applyHeight, 300); });
  addEventListener('pageshow', applyHeight);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', applyHeight);
    visualViewport.addEventListener('scroll', applyHeight);
  }
  document.addEventListener('DOMContentLoaded', applyHeight);

  var shown = false;
  function fail(text) {
    if (shown) return;
    shown = true;
    var boot = document.getElementById('boot');
    var msg = document.getElementById('bootMsg');
    if (!boot || !msg) return;
    boot.classList.add('failed');
    boot.classList.remove('done');
    msg.textContent = text;
  }
  window.__bootFail = fail;
  window.addEventListener('error', function (e) {
    fail('Не удалось запустить 3D: ' + (e.message || 'ошибка загрузки') +
         '. Попробуйте обновить браузер.');
  });
  window.addEventListener('unhandledrejection', function () {
    fail('Не удалось загрузить модель шара. Проверьте соединение и обновите страницу.');
  });
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.__ball) {
        try {
          var c = document.createElement('canvas');
          var gl = c.getContext('webgl2') || c.getContext('webgl');
          fail(gl ? 'Шар долго не загружается — проверьте соединение и обновите страницу.'
                  : 'Ваш браузер не поддерживает WebGL, 3D-шар не запустится.');
        } catch (err) { fail('3D недоступно в этом браузере.'); }
      }
    }, 12000);
  });
})();
</script>
<script src="bundle.js"></script>
</body>
</html>
